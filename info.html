<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ecf0f1; color: #2c3e50; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .welcome-card { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 2.5em; color: #2980b9; margin-top: 0; }
        p { font-size: 1.2em; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Welcome to the Book Library</h1>
        <p>Select a book from the list on the left to view its detailed information.</p>
    </div>
</body>
</html>
